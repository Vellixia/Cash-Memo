[package]
name = "cashmemo-appwrite-integration"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[[test]]
name = "schema_contract"
path = "schema_contract.rs"

[[test]]
name = "owner_scope_contract"
path = "owner_scope_contract.rs"

[[test]]
name = "not_found_isolation"
path = "not_found_isolation.rs"

[[test]]
name = "auth_isolation"
path = "auth_isolation.rs"

[[test]]
name = "direct_tablesdb_denial"
path = "direct_tablesdb_denial.rs"

[[test]]
name = "create_idempotency"
path = "create_idempotency.rs"

[dependencies]
cashmemo-application = { path = "../../backend/crates/application" }
cashmemo-appwrite-adapter = { path = "../../backend/crates/appwrite-adapter" }
cashmemo-domain = { path = "../../backend/crates/domain" }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.17.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
