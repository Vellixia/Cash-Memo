version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      patch-updates:
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels: [dependencies, javascript]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    groups:
      patch-updates:
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directory: /infra/containers
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    groups:
      patch-updates:
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /infra/pgbackrest
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    groups:
      patch-updates:
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /infra/dokploy
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    groups:
      patch-updates:
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels: [dependencies, docker]
