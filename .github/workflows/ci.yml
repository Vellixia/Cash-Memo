name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: cashmemo
          POSTGRES_PASSWORD: cashmemo
          POSTGRES_DB: cashmemo
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      s3:
        image: rustfs/rustfs
        env:
          RUSTFS_ACCESS_KEY: cashmemo
          RUSTFS_SECRET_KEY: cashmemo-secret
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgres://cashmemo:cashmemo@localhost:5432/cashmemo
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: cashmemo-files
      S3_ACCESS_KEY_ID: cashmemo
      S3_SECRET_ACCESS_KEY: cashmemo-secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Create the S3 bucket
        run: until curl -sf --aws-sigv4 aws:amz:us-east-1:s3 --user cashmemo:cashmemo-secret -X PUT localhost:9000/cashmemo-files -o /dev/null -w '%{http_code}' | grep -qE '200|409'; do sleep 2; done
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: cashmemo
          POSTGRES_PASSWORD: cashmemo
          POSTGRES_DB: cashmemo
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      s3:
        image: rustfs/rustfs
        env:
          RUSTFS_ACCESS_KEY: cashmemo
          RUSTFS_SECRET_KEY: cashmemo-secret
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgres://cashmemo:cashmemo@localhost:5432/cashmemo
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: cashmemo-files
      S3_ACCESS_KEY_ID: cashmemo
      S3_SECRET_ACCESS_KEY: cashmemo-secret
      API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release -p api -p worker
      - name: Create the S3 bucket
        run: until curl -sf --aws-sigv4 aws:amz:us-east-1:s3 --user cashmemo:cashmemo-secret -X PUT localhost:9000/cashmemo-files -o /dev/null -w '%{http_code}' | grep -qE '200|409'; do sleep 2; done
      - run: (./target/release/api &) && (./target/release/worker &) && bun run --cwd apps/web build
      - run: (cd apps/web && PORT=3000 bun run start &) && cd apps/web && bunx playwright install --with-deps chromium
      - run: until curl -sf localhost:3000/login >/dev/null && curl -sf localhost:8080/api/health >/dev/null; do sleep 1; done
      - run: bun run --cwd apps/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
