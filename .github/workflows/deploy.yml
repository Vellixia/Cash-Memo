name: Publish immutable Cashmemo artifacts

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed Git commit SHA
        required: true
      target:
        description: Artifact approval environment
        required: true
        type: choice
        options: [development, staging, production]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ inputs.target }}-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Require exact checked-out revision
        run: test "$(git rev-parse HEAD)" = "${{ inputs.revision }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability policy
        run: pnpm audit --prod --audit-level high
      - name: Secret scan exact source tree
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --config=/repo/.gitleaks.toml --no-git --redact=100 --no-banner
          --exit-code=1
      - run: pnpm toolchain:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm architecture:check
      - run: pnpm test:unit
      - run: pnpm test:property
      - run: pnpm test:contract
      - run: pnpm test:integration
      - run: pnpm test:privacy
      - run: pnpm test:security
      - run: pnpm test:operations

  publish:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ inputs.target }}-artifact
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Resolve repository-owned GHCR names
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "RUNTIME_IMAGE_NAME=ghcr.io/${owner}/cashmemo-runtime" >> "$GITHUB_ENV"
          echo "PGBACKREST_IMAGE_NAME=ghcr.io/${owner}/cashmemo-pgbackrest" >> "$GITHUB_ENV"
          echo "VERIFIER_IMAGE_NAME=ghcr.io/${owner}/cashmemo-verifier" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build local security candidates from exact revision
        env:
          RELEASE_SHA: ${{ inputs.revision }}
        run: |
          docker build --target production --file infra/containers/Dockerfile --build-arg RELEASE_SHA="$RELEASE_SHA" --build-arg BUILD_VERSION="git-$RELEASE_SHA" --tag "cashmemo-runtime:$RELEASE_SHA" .
          docker build --target runtime --file infra/pgbackrest/Dockerfile --build-arg RELEASE_SHA="$RELEASE_SHA" --build-arg BUILD_VERSION="git-$RELEASE_SHA" --tag "cashmemo-pgbackrest:$RELEASE_SHA" .
          docker build --target verifier --file infra/containers/Verifier.Dockerfile --build-arg RELEASE_SHA="$RELEASE_SHA" --build-arg BUILD_VERSION="git-$RELEASE_SHA" --tag "cashmemo-verifier:$RELEASE_SHA" .
          node scripts/verify/verify-image-runtime.mjs runtime "cashmemo-runtime:$RELEASE_SHA"
          node scripts/verify/verify-image-runtime.mjs pgbackrest "cashmemo-pgbackrest:$RELEASE_SHA"
          node scripts/verify/verify-image-runtime.mjs verifier "cashmemo-verifier:$RELEASE_SHA"
      - name: Generate pre-publish runtime SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cashmemo-runtime:${{ inputs.revision }}
          format: spdx-json
          output-file: candidate-runtime.spdx.json
          upload-artifact: false
      - name: Generate pre-publish pgBackRest SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cashmemo-pgbackrest:${{ inputs.revision }}
          format: spdx-json
          output-file: candidate-pgbackrest.spdx.json
          upload-artifact: false
      - name: Generate pre-publish verifier SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cashmemo-verifier:${{ inputs.revision }}
          format: spdx-json
          output-file: candidate-verifier.spdx.json
          upload-artifact: false
      - name: Validate pre-publish SBOMs
        run: >-
          test -s candidate-runtime.spdx.json -a -s candidate-pgbackrest.spdx.json -a -s
          candidate-verifier.spdx.json
      - name: Pre-publish scan runtime candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cashmemo-runtime:${{ inputs.revision }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
      - name: Pre-publish scan pgBackRest candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cashmemo-pgbackrest:${{ inputs.revision }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
      - name: Pre-publish scan verifier candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cashmemo-verifier:${{ inputs.revision }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
      - name: Build exact revision, attest SBOM/provenance, and push by digest
        id: images
        env:
          RELEASE_SHA: ${{ inputs.revision }}
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: |
          docker buildx bake --file infra/containers/docker-bake.hcl artifacts --metadata-file image-metadata.json
          runtime_digest=$(jq -er '.runtime."containerimage.digest"' image-metadata.json)
          pgbackrest_digest=$(jq -er '.pgbackrest."containerimage.digest"' image-metadata.json)
          verifier_digest=$(jq -er '.verifier."containerimage.digest"' image-metadata.json)
          for digest in "$runtime_digest" "$pgbackrest_digest" "$verifier_digest"; do
            test "${digest#sha256:}" != "$digest"
          done
          echo "runtime_digest=$runtime_digest" >> "$GITHUB_OUTPUT"
          echo "pgbackrest_digest=$pgbackrest_digest" >> "$GITHUB_OUTPUT"
          echo "verifier_digest=$verifier_digest" >> "$GITHUB_OUTPUT"
      - name: Scan exact runtime digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.RUNTIME_IMAGE_NAME }}@${{ steps.images.outputs.runtime_digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
      - name: Scan exact pgBackRest digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.PGBACKREST_IMAGE_NAME }}@${{ steps.images.outputs.pgbackrest_digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
      - name: Scan exact verifier digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.VERIFIER_IMAGE_NAME }}@${{ steps.images.outputs.verifier_digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
      - name: Materialize runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.RUNTIME_IMAGE_NAME }}@${{ steps.images.outputs.runtime_digest }}
          format: spdx-json
          output-file: runtime.spdx.json
          upload-artifact: false
      - name: Materialize pgBackRest SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.PGBACKREST_IMAGE_NAME }}@${{ steps.images.outputs.pgbackrest_digest }}
          format: spdx-json
          output-file: pgbackrest.spdx.json
          upload-artifact: false
      - name: Materialize verifier SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.VERIFIER_IMAGE_NAME }}@${{ steps.images.outputs.verifier_digest }}
          format: spdx-json
          output-file: verifier.spdx.json
          upload-artifact: false
      - name: Write content-safe immutable handoff
        env:
          PGBACKREST_DIGEST: ${{ steps.images.outputs.pgbackrest_digest }}
          REVISION: ${{ inputs.revision }}
          RUNTIME_DIGEST: ${{ steps.images.outputs.runtime_digest }}
          TARGET: ${{ inputs.target }}
          VERIFIER_DIGEST: ${{ steps.images.outputs.verifier_digest }}
        run: |
          test -s runtime.spdx.json
          test -s pgbackrest.spdx.json
          test -s verifier.spdx.json
          runtime_sbom=$(sha256sum runtime.spdx.json | cut -d ' ' -f1)
          pgbackrest_sbom=$(sha256sum pgbackrest.spdx.json | cut -d ' ' -f1)
          verifier_sbom=$(sha256sum verifier.spdx.json | cut -d ' ' -f1)
          jq -n \
            --arg revision "$REVISION" --arg target "$TARGET" \
            --arg runtimeImage "$RUNTIME_IMAGE_NAME" --arg runtimeDigest "$RUNTIME_DIGEST" --arg runtimeSbom "$runtime_sbom" \
            --arg pgbackrestImage "$PGBACKREST_IMAGE_NAME" --arg pgbackrestDigest "$PGBACKREST_DIGEST" --arg pgbackrestSbom "$pgbackrest_sbom" \
            --arg verifierImage "$VERIFIER_IMAGE_NAME" --arg verifierDigest "$VERIFIER_DIGEST" --arg verifierSbom "$verifier_sbom" \
            '{schemaVersion:"cashmemo-oci-artifacts-v2",revision:$revision,target:$target,deployed:false,artifacts:{runtime:{image:$runtimeImage,digest:$runtimeDigest,sbomSha256:$runtimeSbom,scan:"pass",roles:["api","worker","migrate"]},pgbackrest:{image:$pgbackrestImage,digest:$pgbackrestDigest,sbomSha256:$pgbackrestSbom,scan:"pass",version:"2.59.0"},verifier:{image:$verifierImage,digest:$verifierDigest,sbomSha256:$verifierSbom,scan:"pass",productionAllowed:false}}}' \
            > cashmemo-oci-handoff.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cashmemo-oci-handoff-${{ inputs.target }}-${{ inputs.revision }}
          path: |
            cashmemo-oci-handoff.json
            image-metadata.json
            runtime.spdx.json
            pgbackrest.spdx.json
            verifier.spdx.json
          retention-days: 7
