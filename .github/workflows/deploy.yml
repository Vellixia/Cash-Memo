name: Publish immutable Dokploy handoff

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed Git commit SHA
        required: true
      target:
        description: Protected deployment environment
        required: true
        type: choice
        options: [development, staging, production]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Require exact checked-out revision
        run: test "$(git rev-parse HEAD)" = "${{ inputs.revision }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:property
      - run: pnpm test:integration
      - run: pnpm test:privacy
      - run: pnpm test:security
      - run: pnpm test:operations

  publish:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.target }}-artifact
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Login to protected OCI registry
        env:
          OCI_PASSWORD: ${{ secrets.OCI_PASSWORD }}
        run:
          printf '%s' "$OCI_PASSWORD" | docker login "${{ vars.OCI_REGISTRY }}" --username "${{
          vars.OCI_USERNAME }}" --password-stdin
      - name: Build once, attach provenance/SBOM, and push by digest
        id: handoff
        env:
          IMAGE_NAME: ${{ vars.OCI_IMAGE }}
          RELEASE_SHA: ${{ inputs.revision }}
          PGBACKREST_IMAGE_NAME: ${{ vars.PGBACKREST_OCI_IMAGE }}
        run: |
          docker buildx bake --file infra/containers/docker-bake.hcl production --push --metadata-file image-metadata.json
          digest=$(jq -er '.["production"]."containerimage.digest"' image-metadata.json)
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx build --file infra/pgbackrest/Dockerfile --tag "${PGBACKREST_IMAGE_NAME}:${RELEASE_SHA}" --provenance=mode=max --sbom=true --push --metadata-file pgbackrest-image-metadata.json .
          pgbackrest_digest=$(jq -er '."containerimage.digest"' pgbackrest-image-metadata.json)
          test "${pgbackrest_digest#sha256:}" != "$pgbackrest_digest"
          echo "pgbackrest_digest=$pgbackrest_digest" >> "$GITHUB_OUTPUT"
          jq -n --arg digest "$digest" --arg image "${{ vars.OCI_IMAGE }}" --arg pgbackrestDigest "$pgbackrest_digest" --arg pgbackrestImage "${{ vars.PGBACKREST_OCI_IMAGE }}" --arg revision "${{ inputs.revision }}" --arg target "${{ inputs.target }}" '{schemaVersion:"cashmemo-dokploy-handoff-v1",image:$image,imageDigest:$digest,pgbackrestImage:$pgbackrestImage,pgbackrestImageDigest:$pgbackrestDigest,revision:$revision,target:$target,deployed:false}' > dokploy-handoff.json
      - name: Scan exact image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.OCI_IMAGE }}@${{ steps.handoff.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Scan exact pgBackRest image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.PGBACKREST_OCI_IMAGE }}@${{ steps.handoff.outputs.pgbackrest_digest }}
          severity: CRITICAL,HIGH
          exit-code: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dokploy-handoff-${{ inputs.target }}-${{ inputs.revision }}
          path: |
            dokploy-handoff.json
            image-metadata.json
            pgbackrest-image-metadata.json
          retention-days: 7
