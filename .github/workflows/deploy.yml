name: Deploy immutable release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed Git commit SHA
        required: true
      target:
        description: Protected deployment environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

env:
  OPENTOFU_VERSION: 1.12.5
  AWS_PROVIDER_VERSION: 6.59.0
  AWS_REGION: ap-southeast-1

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Require exact checked-out revision
        run: test "$(git rev-parse HEAD)" = "${{ inputs.revision }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:property
      - run: pnpm test:integration
      - run: pnpm test:privacy
      - run: pnpm test:security

  build:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Login to ECR
        run:
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{
          vars.ECR_REGISTRY }}"
      - name: Build once, attach provenance/SBOM, and push by digest
        id: image
        env:
          IMAGE_NAME: ${{ vars.ECR_REPOSITORY_URI }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: |
          docker buildx bake --file infra/containers/docker-bake.hcl production --push --metadata-file image-metadata.json
          digest=$(jq -er '.["production"]."containerimage.digest"' image-metadata.json)
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan exact image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ECR_REPOSITORY_URI }}@${{ steps.image.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: 1

  plan:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.target }}-plan
    outputs:
      plan_sha256: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ap-southeast-1
      - run: node scripts/toolchain/bootstrap-opentofu.mjs > tofu-path.txt
      - name: Create reviewed binary plan
        env:
          TF_VAR_image_digest: ${{ needs.build.outputs.digest }}
          TF_VAR_release_id: ${{ inputs.revision }}
        run: |
          tofu=$(cat tofu-path.txt)
          "$tofu" -chdir="infra/opentofu/environments/${{ inputs.target }}" init -input=false
          "$tofu" -chdir="infra/opentofu/environments/${{ inputs.target }}" plan -input=false -out=release.tfplan
          "$tofu" -chdir="infra/opentofu/environments/${{ inputs.target }}" show -no-color release.tfplan > "release.tfplan.txt"
      - id: digest
        run:
          echo "value=$(sha256sum infra/opentofu/environments/${{ inputs.target }}/release.tfplan |
          cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-plan-${{ inputs.target }}-${{ inputs.revision }}
          path: |
            infra/opentofu/environments/${{ inputs.target }}/release.tfplan
            infra/opentofu/environments/${{ inputs.target }}/release.tfplan.txt
          retention-days: 1

  deploy:
    needs: [build, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-plan-${{ inputs.target }}-${{ inputs.revision }}
          path: infra/opentofu/environments/${{ inputs.target }}
      - run: node scripts/toolchain/bootstrap-opentofu.mjs > tofu-path.txt
      - name: Bind protected plan approval
        run: |
          actual=$(sha256sum "infra/opentofu/environments/${{ inputs.target }}/release.tfplan" | cut -d' ' -f1)
          test "$actual" = "${{ needs.plan.outputs.plan_sha256 }}"
          test "$actual" = "${{ vars.APPROVED_PLAN_SHA256 }}"
      - name: Apply exact reviewed plan artifact
        run: |
          tofu=$(cat tofu-path.txt)
          "$tofu" -chdir="infra/opentofu/environments/${{ inputs.target }}" init -input=false
          "$tofu" -chdir="infra/opentofu/environments/${{ inputs.target }}" apply -input=false release.tfplan
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Run one-shot migration from release digest
        run:
          aws ecs run-task --cluster "${{ vars.ECS_CLUSTER }}" --task-definition "${{
          vars.MIGRATION_TASK_DEFINITION }}" --launch-type FARGATE --network-configuration "${{
          vars.MIGRATION_NETWORK_CONFIGURATION }}" > migration-task.json
      - name: Wait for migration and deploy same digest
        run: |
          task=$(jq -er '.tasks[0].taskArn' migration-task.json)
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$task" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$code" = "0"
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "${{ vars.ECS_SERVICE }}" --force-new-deployment
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_SERVICE }}"
      - name: Synthetic verification
        run:
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 "${{
          vars.SYNTHETIC_HEALTH_URL }}"
