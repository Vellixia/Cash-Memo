name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-and-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability policy
        run: pnpm audit --prod --audit-level high
      - name: License policy
        run: |
          pnpm licenses list --prod --json > production-licenses.json
          node -e 'const v=require("./production-licenses.json");const k=Object.keys(v);if(k.some(x=>/(AGPL|SSPL|BUSL|Commons Clause|Elastic License|unknown|unlicensed)/i.test(x)))process.exit(1)'

  source-infrastructure-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scanning
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --config=/repo/.gitleaks.toml --no-git --redact=100 --no-banner
          --exit-code=1
      - name: IaC static scanning
        run: |
          python3 -m pip install --disable-pip-version-check checkov==3.2.495
          checkov --directory infra --framework terraform --quiet
      - name: Filesystem and dependency scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  image-and-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build exact revision image
        run:
          docker build --target production --file infra/containers/Dockerfile --label
          org.opencontainers.image.revision=${{ github.sha }} -t cashmemo:${{ github.sha }} .
      - name: OCI image scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cashmemo:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Generate SBOM with Syft for exact image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cashmemo:${{ github.sha }}
          format: spdx-json
          output-file: cashmemo-${{ github.sha }}.sbom.json
          artifact-name: cashmemo-${{ github.sha }}.sbom.json
          upload-artifact: true
      - name: Validate SBOM
        run: test -s cashmemo-${{ github.sha }}.sbom.json
