name: Secret scan

on:
  pull_request:
  push:
    branches: [main, "001-cashmemo-mvp"]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-tree:
    name: Redacted current-tree scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current tree
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject tracked local HTTPS material
        run: |
          if git ls-files -- .secrets | grep -q .; then
            echo "Local HTTPS material must never be tracked." >&2
            exit 1
          fi

      - name: Reject tracked environment material
        run: |
          if git ls-files -- '.env*' ':!.env.example' | grep -q .; then
            echo "Environment material other than .env.example must never be tracked." >&2
            exit 1
          fi

      - name: Scan without printing suspected values
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --config=/repo/.gitleaks.toml --no-git --redact=100 --no-banner
          --exit-code=1
