# Builds images on GitHub runners and pushes them to GHCR; Dokploy pulls them.
# (The Dokploy host can't resolve DNS inside docker builds, so it never builds.)
name: images

# Runs only after ci (lint, tests, e2e) passes on main, so a red build never ships.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/vellixia/cashmemo-${{ matrix.app }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/vellixia/cashmemo-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # Dokploy has no registry credentials; new GHCR packages default to private.
      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /orgs/Vellixia/packages/container/cashmemo-${{ matrix.app }} -f visibility=public \
          || echo "Could not set visibility automatically; flip it in the GitHub UI."

  # Roll the new images out once every image is pushed. Needs the DOKPLOY_URL and DOKPLOY_TOKEN
  # secrets plus one DOKPLOY_APP_<APP> secret per app; skipped until they're set.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
    strategy:
      matrix:
        include:
          - app: api
            id_secret: DOKPLOY_APP_API
          - app: web
            id_secret: DOKPLOY_APP_WEB
    steps:
      - name: Point the app at this commit's image and redeploy
        env:
          APP_ID: ${{ secrets[matrix.id_secret] }}
          IMAGE: ghcr.io/vellixia/cashmemo-${{ matrix.app }}:${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$DOKPLOY_TOKEN" ] || [ -z "$APP_ID" ]; then echo "Dokploy secrets not set; skipping."; exit 0; fi
          api() { curl -fsS -X POST "$DOKPLOY_URL/api/$1" -H "x-api-key: $DOKPLOY_TOKEN" -H 'content-type: application/json' -d "$2"; }
          api application.saveDockerProvider "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE\",\"username\":null,\"password\":null,\"registryUrl\":null}"
          api application.deploy "{\"applicationId\":\"$APP_ID\"}"
