# Builds images on GitHub runners and pushes them to GHCR; Dokploy pulls them.
# (The Dokploy host can't resolve DNS inside docker builds, so it never builds.)
name: images

on:
  push:
    branches: [v1]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/vellixia/cashmemo-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/vellixia/cashmemo-${{ matrix.app }}:v1
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # Dokploy has no registry credentials; new GHCR packages default to private.
      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /orgs/Vellixia/packages/container/cashmemo-${{ matrix.app }} -f visibility=public \
          || echo "Could not set visibility automatically; flip it in the GitHub UI."
