name: cashmemo

services:
  appwrite:
    image: ${APPWRITE_IMAGE:-appwrite/appwrite:1.9.6@sha256:3d4dfbb5f989e88eef9211dd3184f53d8502f41d0c173b8b651a369ed4578789}
    restart: unless-stopped
    ports: ["8080:80"]
    environment:
      _APP_ENV: development
      _APP_OPENSSL_KEY_V1: ${APPWRITE_OPENSSL_KEY:?required}
      _APP_DOMAIN: localhost
      _APP_DOMAIN_TARGET: localhost
      _APP_SYSTEM_SECURITY_EMAIL_ADDRESS: security@localhost
    networks: [private]

  backend:
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
    restart: unless-stopped
    depends_on: [appwrite, otel-collector]
    env_file: ../../config/local-secrets/cashmemo.env
    environment:
      APPWRITE_ENDPOINT: http://appwrite/v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["3001:3001"]
    networks: [private]

  web:
    build:
      context: ../..
      dockerfile: infra/compose/web.Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      CASHMEMO_API_ORIGIN: http://backend:3001
    ports: ["3000:3000"]
    networks: [private]

  suppression-store:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z}
    command: server /data --console-address :9001
    restart: unless-stopped
    env_file: ../../config/local-secrets/cashmemo.env
    environment:
      MINIO_ROOT_USER: ${SUPPRESSION_S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${SUPPRESSION_S3_SECRET_KEY:?required}
    volumes: [suppression-data:/data]
    networks: [private]

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.130.1}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [openobserve]
    networks: [private]

  openobserve:
    image: ${OPENOBSERVE_IMAGE:-public.ecr.aws/zinclabs/openobserve:v0.15.1}
    restart: unless-stopped
    env_file: ../../config/local-secrets/cashmemo.env
    volumes: [openobserve-data:/data]
    networks: [private]

networks:
  private:
    internal: false

volumes:
  suppression-data:
  openobserve-data:
