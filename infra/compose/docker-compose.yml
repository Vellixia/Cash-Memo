name: cashmemo

# MongoDB and Redis below are Appwrite-owned infrastructure. Cashmemo application containers have
# no network credentials or drivers for either service and access TablesDB only through Appwrite.
services:
  appwrite-db:
    image: mongo:8.2.5@sha256:60aa240412f473f672ec8b282fd5651aa156dcc7a220f81f5381ce768ccc3167
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${APPWRITE_DB_ROOT_PASSWORD:?required}
      MONGO_INITDB_DATABASE: appwrite
      MONGO_INITDB_USERNAME: appwrite
      MONGO_INITDB_PASSWORD: ${APPWRITE_DB_PASSWORD:?required}
    volumes:
      - appwrite-db:/data/db
      - appwrite-db-keyfile:/data/keyfile
      - ../appwrite/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ../appwrite/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh -u root -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --quiet --eval 'try { const h=db.adminCommand({hello:1}); if(h.isWritablePrimary &&
          h.setName==="rs0") quit(0); } catch(e) {} try { rs.initiate({_id:"rs0",members:
          [{_id:0,host:"appwrite-db:27017"}]}); } catch(e) {} quit(1);'
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [appwrite-internal]

  appwrite-cache:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    volumes: [appwrite-cache:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [appwrite-internal]

  appwrite-embedding:
    image: appwrite/embedding:0.1.0@sha256:0ba6942b5a7d560523ae1ef8673e41da47468fa85f5d3992badaa5abe9714b54
    restart: unless-stopped
    volumes: [appwrite-models:/home/embedder/models]
    networks: [appwrite-internal]

  appwrite:
    image: appwrite/appwrite:1.9.6@sha256:adc7d0e7ec23c88c427aa69f5f3f9d95e6fdf306df29d857f110069985b31a8e
    restart: unless-stopped
    depends_on:
      appwrite-db: { condition: service_healthy }
      appwrite-cache: { condition: service_healthy }
      appwrite-embedding: { condition: service_started }
    environment: &appwrite-environment
      _APP_ENV: development
      _APP_OPENSSL_KEY_V1: ${APPWRITE_OPENSSL_KEY:?required}
      _APP_DOMAIN: localhost
      _APP_DOMAIN_TARGET: localhost
      _APP_SYSTEM_SECURITY_EMAIL_ADDRESS: security@localhost
      _APP_CONSOLE_WHITELIST_ROOT: disabled
      _APP_DB_ADAPTER: mongodb
      _APP_DB_HOST: appwrite-db
      _APP_DB_PORT: 27017
      _APP_DB_SCHEMA: appwrite
      _APP_DB_USER: appwrite
      _APP_DB_PASS: ${APPWRITE_DB_PASSWORD:?required}
      _APP_REDIS_HOST: appwrite-cache
      _APP_REDIS_PORT: 6379
      _APP_EMBEDDING_ENDPOINT: http://appwrite-embedding:3000
      _APP_EMBEDDING_MODELS: nomic-embed-text
      _APP_USAGE_STATS: disabled
    ports: ["8180:80"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H 'Host: localhost' http://localhost/v1/health/version"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [appwrite-internal, cashmemo-private]

  appwrite-worker-databases:
    image: appwrite/appwrite:1.9.6@sha256:adc7d0e7ec23c88c427aa69f5f3f9d95e6fdf306df29d857f110069985b31a8e
    entrypoint: worker-databases
    restart: unless-stopped
    depends_on:
      appwrite-db: { condition: service_healthy }
      appwrite-cache: { condition: service_healthy }
      appwrite-embedding: { condition: service_started }
    environment:
      <<: *appwrite-environment
      _APP_WORKERS_NUM: 1
      _APP_WORKER_MAX_COROUTINES: 1
    networks: [appwrite-internal]

  backend:
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      appwrite: { condition: service_healthy }
      otel-collector: { condition: service_started }
    env_file:
      - ../../config/local-secrets/cashmemo.env
      - path: ../../config/local-secrets/appwrite-runtime.env
        required: false
    environment:
      APPWRITE_ENDPOINT: http://appwrite/v1
      APPWRITE_DATABASE_ID: cashmemo
      CASHMEMO_HTTP_BIND: 0.0.0.0:3001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["3001:3001"]
    networks: [cashmemo-private]

  web:
    build:
      context: ../..
      dockerfile: infra/compose/web.Dockerfile
      args:
        CASHMEMO_API_ORIGIN: http://backend:3001
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }
    environment:
      CASHMEMO_API_ORIGIN: http://backend:3001
    ports: ["3000:3000"]
    networks: [cashmemo-private]

  suppression-store:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${SUPPRESSION_S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${SUPPRESSION_S3_SECRET_KEY:?required}
    volumes: [suppression-data:/data]
    networks: [cashmemo-private]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OPENOBSERVE_AUTH_CREDENTIAL: ${OPENOBSERVE_AUTH_CREDENTIAL:?required}
    volumes:
      - ../otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [openobserve]
    ports: ["4318:4318"]
    networks: [cashmemo-private]

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.15.1@sha256:1ce5d9f413fda537f2397322f7c830c823aaec50b2bfe00a8d229cd578217080
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:?required}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?required}
    volumes: [openobserve-data:/data]
    ports: ["5080:5080"]
    networks: [cashmemo-private]

networks:
  appwrite-internal:
    internal: true
  cashmemo-private:

volumes:
  appwrite-db:
  appwrite-db-keyfile:
  appwrite-cache:
  appwrite-models:
  suppression-data:
  openobserve-data:
