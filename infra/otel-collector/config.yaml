receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}

processors:
  memory_limiter:
    limit_mib: 256
  transform/privacy_allowlist:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.request.method", "http.response.status_code", "http.route", "cashmemo.error_code", "cashmemo.operation", "service.version"])
          - set(name, "cashmemo.request")
          - set(status.message, "")
      - context: spanevent
        statements:
          - keep_keys(attributes, ["cashmemo.error_code", "cashmemo.operation"])
          - set(name, "cashmemo.event")
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: log
        statements:
          - keep_keys(attributes, ["cashmemo.error_code", "cashmemo.operation", "service.version"])
          - set(body, "cashmemo.event")
          - set(severity_text, "")
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: metric
        statements:
          - set(name, "cashmemo.metric")
          - set(description, "")
      - context: datapoint
        statements:
          - keep_keys(attributes, ["cashmemo.operation", "service.version"])
  batch: {}

exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: Basic ${env:OPENOBSERVE_AUTH_CREDENTIAL}
  debug/privacy_evidence:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy_allowlist, batch]
      exporters: [otlphttp/openobserve, debug/privacy_evidence]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy_allowlist, batch]
      exporters: [otlphttp/openobserve, debug/privacy_evidence]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy_allowlist, batch]
      exporters: [otlphttp/openobserve, debug/privacy_evidence]
