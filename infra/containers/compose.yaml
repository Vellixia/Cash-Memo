name: cashmemo-local

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashmemo
      POSTGRES_USER: cashmemo
      POSTGRES_PASSWORD: cashmemo-local-only
    ports:
      - "127.0.0.1:${CASHMEMO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashmemo -d cashmemo"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres18-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CASHMEMO_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${CASHMEMO_MAILPIT_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit-data:/data

  object-fake:
    image: adobe/s3mock:5.1.0
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: >-
        cashmemo-local-exports,cashmemo-local-evidence,cashmemo-local-deletion-ledger
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "false"
    ports:
      - "127.0.0.1:${CASHMEMO_OBJECT_PORT:-9090}:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.local.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${CASHMEMO_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${CASHMEMO_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${CASHMEMO_OTEL_HEALTH_PORT:-13133}:13133"

volumes:
  postgres18-data:
  mailpit-data:
