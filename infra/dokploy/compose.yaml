name: cashmemo-development

# PostgreSQL, RustFS Primary, RustFS Secondary Dev, Infisical, and OTLP/OpenObserve are
# pre-existing Dokploy resources. This definition consumes their injected endpoints only.
services:
  cashmemo-migrate:
    image: ${CASHMEMO_RUNTIME_IMAGE:?immutable ghcr.io image@sha256 digest required}
    command: ["migrate"]
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: ["${CASHMEMO_MIGRATION_ENV_FILE:?protected migration-only environment required}"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/lib/cashmemo/work:rw,noexec,nosuid,size=32m
    networks: [dokploy-network]
    profiles: ["migration"]

  cashmemo-api:
    image: ${CASHMEMO_RUNTIME_IMAGE:?immutable ghcr.io image@sha256 digest required}
    command: ["api"]
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      PROCESS_ROLE: api
      PORT: "3000"
    env_file: ["${CASHMEMO_API_ENV_FILE:?protected API environment required}"]
    expose: ["3000"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/cashmemo/audio:rw,noexec,nosuid,size=16m
      - /var/lib/cashmemo/work:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "/usr/local/lib/cashmemo/runtime-healthcheck.mjs", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [dokploy-network]

  cashmemo-worker:
    image: ${CASHMEMO_RUNTIME_IMAGE:?immutable ghcr.io image@sha256 digest required}
    command: ["worker"]
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      PROCESS_ROLE: worker
      PORT: "3001"
    env_file: ["${CASHMEMO_WORKER_ENV_FILE:?protected worker environment required}"]
    expose: ["3001"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/lib/cashmemo/work:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "/usr/local/lib/cashmemo/runtime-healthcheck.mjs", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [dokploy-network]

  cashmemo-pgbackrest:
    image: ${PGBACKREST_IMAGE:?immutable ghcr.io image@sha256 digest required}
    command: ["health"]
    restart: "no"
    user: "10002:10002"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: ["${PGBACKREST_ENV_FILE:?protected backup-only environment required}"]
    volumes:
      - cashmemo-postgres-data:/var/lib/postgresql/18/docker:ro
      - cashmemo-postgres-socket:/var/run/postgresql:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/lib/pgbackrest:rw,noexec,nosuid,size=32m
      - /var/spool/pgbackrest:rw,noexec,nosuid,size=64m
    networks: [dokploy-network]
    profiles: ["backup-check"]

  cashmemo-verifier:
    image: ${CASHMEMO_VERIFIER_IMAGE:?immutable ghcr.io image@sha256 digest required}
    command: ["${CASHMEMO_VERIFIER_MODE:-full-development}"]
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: ["${CASHMEMO_VERIFIER_ENV_FILE:?protected synthetic verifier environment required}"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /tmp/cashmemo-verifier:rw,noexec,nosuid,size=64m
      - /workspace/test-results:rw,noexec,nosuid,size=128m
      - /workspace/playwright-report:rw,noexec,nosuid,size=64m
    networks: [dokploy-network]
    profiles: ["verification"]

networks:
  dokploy-network:
    external: true

volumes:
  cashmemo-postgres-data:
    external: true
    name: ${CASHMEMO_POSTGRES_VOLUME_NAME:?existing PostgreSQL volume name required}
  cashmemo-postgres-socket:
    external: true
    name: ${CASHMEMO_POSTGRES_SOCKET_VOLUME_NAME:?existing PostgreSQL socket volume required}
