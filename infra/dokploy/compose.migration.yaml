services:
  cashmemo-migration:
    image: ${CASHMEMO_RUNTIME_IMAGE:?immutable ghcr.io image@sha256 digest required}
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: ["${CASHMEMO_MIGRATION_ENV_FILE:?injected migration environment required}"]
    command: ["migrate"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/lib/cashmemo/work:rw,noexec,nosuid,size=32m
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true
