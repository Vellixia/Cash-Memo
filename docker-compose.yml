services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cashmemo
      POSTGRES_PASSWORD: cashmemo
      POSTGRES_DB: cashmemo
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql]
  # Local stand-in for Cloudflare R2 (S3 API) for CSV export/import.
  s3:
    image: rustfs/rustfs
    environment:
      RUSTFS_ACCESS_KEY: cashmemo
      RUSTFS_SECRET_KEY: cashmemo-secret
    ports: ["9000:9000"]
    volumes: [s3:/data]
  s3-bucket:
    image: curlimages/curl
    depends_on: [s3]
    restart: on-failure
    # Creates the bucket (409 = already there). curl signs the request itself (SigV4).
    command: >
      sh -c "sleep 2; code=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3
      --user cashmemo:cashmemo-secret -X PUT http://s3:9000/cashmemo-files);
      echo bucket $$code; [ $$code = 200 ] || [ $$code = 409 ]"
volumes:
  db:
  s3:
