[package]
name = "worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
domain = { path = "../../crates/domain" }
telemetry = { path = "../../crates/telemetry" }
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
tracing = "0.1"
sentry = { version = "0.49", default-features = false }
dotenvy = "0.15.7"
csv = "1.4.0"
futures-util = "0.3.34"
chrono = "0.4.45"
uuid = "1.26.1"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
dotenvy = "0.15.7"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
