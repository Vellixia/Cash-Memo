[workspace]
members = [
  "crates/appwrite-adapter",
  "crates/application",
  "crates/cashmemo",
  "crates/domain",
  "crates/http-adapter",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "=0.10.3"
async-trait = "=0.1.91"
axum = "=0.8.9"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
hmac = "=0.12.1"
rand = "=0.9.5"
regex = "=1.12.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tower = "=0.5.3"
tower-http = { version = "=0.6.11", features = ["catch-panic", "request-id", "trace"] }
tracing = "=0.1.44"
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
