[workspace]
members = ["v1/api"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
axum = "0.8.6"
chrono-tz = "0.10.4"
clap = { version = "4.5.47", features = ["derive"] }
rust_decimal = { version = "1.39.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "rust_decimal", "uuid"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.18.0", features = ["v4"] }
